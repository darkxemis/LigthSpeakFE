<button
  type="button"
  role="switch"
  class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full border transition-colors disabled:cursor-not-allowed disabled:opacity-50"
  [class.bg-beam-cyan]="checked()"
  [class.border-beam-cyan]="checked()"
  [class.bg-aurora-line-strong]="!checked()"
  [class.border-transparent]="!checked()"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="label() || null"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <span
    class="pointer-events-none inline-block h-4 w-4 rounded-full bg-white shadow transition-transform"
    [class.translate-x-6]="checked()"
    [class.translate-x-1]="!checked()"
  ></span>
</button>
