@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
  >
    <button
      type="button"
      class="absolute inset-0 bg-aurora-void/80 backdrop-blur-sm"
      [attr.aria-label]="'common.close' | t"
      (click)="dismiss.emit()"
    ></button>
    <div class="aurora-card animate-fade-in-up relative z-10 max-h-[90vh] w-full max-w-md overflow-y-auto rounded-2xl p-6">
      <div class="mb-5 flex items-start justify-between gap-4">
        <div>
          <h2 class="text-xl font-semibold tracking-tight text-ink">{{ title() }}</h2>
          @if (subtitle()) {
            <p class="mt-1 text-sm text-ink-muted">{{ subtitle() }}</p>
          }
        </div>
        <button
          type="button"
          class="rounded-md p-1.5 text-ink-muted transition hover:bg-aurora-hover hover:text-ink"
          [attr.aria-label]="'common.close' | t"
          (click)="dismiss.emit()"
        >
          <ls-icon name="x" [size]="18" />
        </button>
      </div>
      <ng-content />
    </div>
  </div>
}
